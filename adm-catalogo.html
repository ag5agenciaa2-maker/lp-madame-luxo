<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo | Catálogo Madame Luxo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="adm-catalogo.css">
</head>
<body>
    <!-- Tela de Login -->
    <div id="login-screen" class="login-screen">
        <div class="login-card">
            <div class="login-logo">
                <img src="assets/logo-madame-luxo-desktop.webp" alt="Madame Luxo" width="180">
            </div>
            <h1>Painel Administrativo</h1>
            <p class="login-subtitle">Gerencie o catálogo de produtos</p>
            <div class="login-field">
                <input type="password" id="login-senha" class="login-input" placeholder="Digite a senha"
                    onkeydown="if(event.key==='Enter') handleLogin()">
                <button class="login-btn" onclick="handleLogin()">Entrar</button>
            </div>
            <p id="login-erro" class="login-erro" hidden>Senha incorreta. Tente novamente.</p>
            <p class="login-hint">Painel restrito — Madame Luxo Admin</p>
        </div>
    </div>

    <!-- Painel Principal (escondido até login) -->
    <div id="admin-panel" class="admin-panel" hidden>
        <!-- Header -->
        <header class="admin-header">
            <div class="header-brand">
                <img src="assets/logo-madame-luxo-desktop.webp" alt="Madame Luxo" width="140">
                <span class="header-badge">Admin</span>
            </div>
            <div class="header-actions">
                <button class="btn-header" id="btn-refresh" title="Atualizar">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
                </button>
                <button class="btn-header btn-primary" id="btn-novo-produto">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    Novo Produto
                </button>
                <button class="btn-header btn-logout" id="btn-logout">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
                    Sair
                </button>
            </div>
        </header>

        <!-- Stats Bar -->
        <div class="stats-bar">
            <div class="stat-item">
                <span class="stat-value" id="stat-total">0</span>
                <span class="stat-label">Total de Produtos</span>
            </div>
            <div class="stat-item">
                <span class="stat-value" id="stat-ativos">0</span>
                <span class="stat-label">Ativos</span>
            </div>
            <div class="stat-item">
                <span class="stat-value" id="stat-inativos">0</span>
                <span class="stat-label">Inativos</span>
            </div>
            <div class="stat-item">
                <span class="stat-value" id="stat-categorias">0</span>
                <span class="stat-label">Categorias</span>
            </div>
        </div>

        <!-- Filtros -->
        <div class="filters-bar">
            <div class="filter-group">
                <input type="text" id="filter-search" class="filter-input" placeholder="Buscar por nome, categoria...">
                <svg class="filter-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </div>
            <select id="filter-categoria" class="filter-select">
                <option value="">Todas as Categorias</option>
                <option value="vestidos">Vestidos</option>
                <option value="macacoes">Macacões</option>
                <option value="conjuntos">Conjuntos</option>
                <option value="saias">Saias</option>
                <option value="bodys">Bodys</option>
                <option value="blusas">Blusas</option>
                <option value="plus-size">Plus Size</option>
                <option value="shorts">Shorts</option>
                <option value="acessorios">Acessórios</option>
                <option value="macaquinhos">Macaquinhos</option>
                <option value="nova-colecao">Nova Coleção</option>
            </select>
            <select id="filter-status" class="filter-select">
                <option value="">Todos os Status</option>
                <option value="ativo">Ativo</option>
                <option value="inativo">Inativo</option>
            </select>
        </div>

        <!-- Tabela de Produtos -->
        <div class="table-container">
            <table class="products-table" id="products-table">
                <thead>
                    <tr>
                        <th class="col-imagem">Imagem</th>
                        <th class="col-nome">Nome</th>
                        <th class="col-categoria">Categoria</th>
                        <th class="col-preco">Preço</th>
                        <th class="col-status">Status</th>
                        <th class="col-acoes">Ações</th>
                    </tr>
                </thead>
                <tbody id="products-tbody">
                    <!-- Preenchido via JS -->
                </tbody>
            </table>
            <div id="empty-state" class="empty-state" hidden>
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="1"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
                <p>Nenhum produto encontrado</p>
            </div>
            <div id="loading-state" class="loading-state">
                <div class="spinner"></div>
                <p>Carregando produtos...</p>
            </div>
        </div>
    </div>

    <!-- Modal: Formulário de Produto -->
    <div id="modal-produto" class="modal-overlay" hidden>
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Novo Produto</h2>
                <button class="modal-close" id="modal-close">&times;</button>
            </div>
            <form id="form-produto" class="modal-form">
                <input type="hidden" id="prod-row-index">
                <input type="hidden" id="prod-id">
                
                <div class="form-grid">
                    <div class="form-group form-group-full">
                        <label for="prod-nome">Nome da Peça / Conjunto *</label>
                        <input type="text" id="prod-nome" required placeholder="Ex: Vestido Midi Floral">
                    </div>

                    <div class="form-group">
                        <label for="prod-categoria">Categoria *</label>
                        <select id="prod-categoria" required>
                            <option value="">Selecione...</option>
                            <option value="Vestidos">Vestidos</option>
                            <option value="Macacões">Macacões</option>
                            <option value="Conjuntos">Conjuntos</option>
                            <option value="Saias">Saias</option>
                            <option value="Bodys">Bodys</option>
                            <option value="Blusas">Blusas</option>
                            <option value="Plus Size">Plus Size</option>
                            <option value="Shorts">Shorts</option>
                            <option value="Acessórios">Acessórios</option>
                            <option value="Macaquinhos">Macaquinhos</option>
                            <option value="Nova Coleção">Nova Coleção</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="prod-tipo">Tipo de Produto *</label>
                        <input type="text" id="prod-tipo" required placeholder="Ex: Vestido Midi · Viscose · Terracota">
                    </div>

                    <div class="form-group">
                        <label for="prod-preco-de">Preço DE (R$)</label>
                        <input type="text" id="prod-preco-de" placeholder="Ex: 219,90">
                    </div>

                    <div class="form-group">
                        <label for="prod-preco-por">Preço POR (R$) *</label>
                        <input type="text" id="prod-preco-por" required placeholder="Ex: 179,90">
                    </div>

                    <div class="form-group">
                        <label for="prod-desconto">Desconto %</label>
                        <input type="text" id="prod-desconto" placeholder="Ex: 18%">
                    </div>

                    <div class="form-group">
                        <label for="prod-tamanhos">Tamanhos Disponíveis *</label>
                        <input type="text" id="prod-tamanhos" required placeholder="Ex: P · M · G · GG">
                    </div>

                    <div class="form-group form-group-full">
                        <label for="prod-imagem1">🖼️ Imagem Destaque (URL) *</label>
                        <input type="url" id="prod-imagem1" required placeholder="https://...">
                        <img id="preview-imagem1" class="img-preview" hidden>
                    </div>

                    <div class="form-group form-group-full">
                        <label for="prod-imagem2">Imagem 2 (URL)</label>
                        <input type="url" id="prod-imagem2" placeholder="https://...">
                    </div>

                    <div class="form-group form-group-full">
                        <label for="prod-imagem3">Imagem 3 (URL)</label>
                        <input type="url" id="prod-imagem3" placeholder="https://...">
                    </div>

                    <div class="form-group form-group-full">
                        <label for="prod-descricao">Descrição *</label>
                        <textarea id="prod-descricao" rows="3" required placeholder="Descrição do produto..."></textarea>
                    </div>

                    <div class="form-group">
                        <label for="prod-material">Material / Tecido</label>
                        <input type="text" id="prod-material" placeholder="Ex: Viscose">
                    </div>

                    <div class="form-group">
                        <label for="prod-cor">Cor Principal *</label>
                        <input type="text" id="prod-cor" required placeholder="Ex: Terracota">
                    </div>

                    <div class="form-group">
                        <label for="prod-estoque">Qtd. Estoque</label>
                        <input type="text" id="prod-estoque" placeholder="Ex: 15">
                    </div>

                    <div class="form-group">
                        <label for="prod-status">Status *</label>
                        <select id="prod-status" required>
                            <option value="Ativo">Ativo</option>
                            <option value="Inativo">Inativo</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="prod-oferta">🔥 Oferta em Destaque?</label>
                        <select id="prod-oferta">
                            <option value="">Não</option>
                            <option value="Sim">Sim</option>
                        </select>
                    </div>

                    <div class="form-group form-group-full">
                        <label for="prod-link">Link do Produto (URL)</label>
                        <input type="url" id="prod-link" placeholder="https://...">
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" id="btn-cancelar">Cancelar</button>
                    <button type="submit" class="btn btn-primary" id="btn-salvar">
                        <span class="btn-text">Salvar Produto</span>
                        <span class="btn-spinner" hidden></span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div id="toast-container" class="toast-container"></div>

    <script src="adm-catalogo.js"></script>
</body>
</html>
